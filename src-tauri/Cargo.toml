[package]
name = "plume"
version = "0.7.0"
description = "Smart Image Compression Desktop App"
authors = ["MrCasquette"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "plume_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Hard lint posture: panics that skip the typed error boundary are denied.
# `pedantic` is intentionally deferred — it will be enabled and triaged
# separately so its fallout on the FFI engine can be measured, not bulk-silenced.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

# Async concurrency — Semaphore bounding how many compressions run at once
tokio = { version = "1", features = ["sync"] }

# Image compression
oxipng = "9.1"
image = "0.25"
mozjpeg-sys = { version = "2.2", features = ["icc_io"] }
webp = "0.3"
libheif-rs = "2.6"
libheif-sys = { version = "5.2", features = ["embedded-libheif"] }

# System utilities
dirs = "5.0"
base64 = "0.22"
thiserror = "1.0"

# Statistics database
rusqlite = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

tempfile = "3.6"

# Optimize all dependencies in dev mode (compression libs are 10-50x slower without)
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Patch libheif-sys to only compile LIBDE265 decoder (HEIC photos).
# All video codecs (x265, dav1d, rav1e, svt-av1, aom, x264) are disabled.
[patch.crates-io]
libheif-sys = { path = "patches/libheif-sys" }
