name: Rust

# BASIC tier for Rust: fmt + clippy. Path-filtered → only triggers when `src-tauri/**` (or the
# toolchain) changes. A docs or frontend commit never pays for the native build
# (mozjpeg/libheif/nasm). `cargo test` lives in the release gate.

on:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust.yml'

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            nasm

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy actually compiles the crate → catches build regressions.
      # `cargo test` (assertions) lives in the release gate, not here (basic tier).
      # --locked: build against the committed Cargo.lock, fail if the manifest diverged.
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
