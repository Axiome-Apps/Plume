name: CI

# BASIC tier for JS/TS, on every push/PR: version guard, lint, type-check, frontend tests.
# Runs in seconds. Rust (fmt + clippy) lives in rust.yml, path-filtered on `src-tauri/**` → a
# docs or frontend commit never pays for the native build. Rust tests + builds are in release.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Node version is pinned by .nvmrc (single source, read by `nvm use` locally too),
      # not a floating `lts/*`. engines.node in package.json is the advisory compat floor.
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      # Version drift guard: the 4 files (package.json, tauri.conf.json, Cargo.toml,
      # Cargo.lock) must agree. Fails if someone edited one by hand instead of running
      # `pnpm bump`. Node alone is enough — no install required.
      - name: Version consistency guard
        run: node scripts/check-version.mjs

      # --frozen-lockfile: CI consumes pnpm-lock.yaml as-is and fails if it diverges from
      # package.json, never regenerating it silently (reproducibility invariant).
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # Vitest compiles nothing native, so the frontend suite runs in about a second and
      # belongs in the basic tier — unlike the Rust tests, which stay in the release gate.
      - name: Frontend tests
        run: pnpm test
