name: Release

# Triggered ONLY by a `vX.Y.Z` tag, and that tag is only ever produced by `pnpm bump`
# (scripts/bump.mjs). So: builds ⇔ bump, never otherwise.
#
# ADVANCED tier, in three stages:
#   1. gate     — tests + strict checks + version guard (tag == the 4 files). A failure here
#                 blocks everything: no mis-versioned or broken binary ever ships.
#   2. build    — 4-platform matrix (tauri-action) → GitHub Release with the assets.
#   3. homebrew — updates the tap cask (DMG SHA256s) once the assets are published.

on:
  push:
    tags:
      - 'v*.*.*'

concurrency: release-${{ github.ref }}

jobs:
  # ── Advanced gate: nothing gets built until this is green. ───────────────────────────────
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            nasm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The tag must match the 4 version files EXACTLY. Last barrier against a tag placed by
      # hand or left out of sync.
      - name: Version matches tag
        run: node scripts/check-version.mjs --expect "${{ github.ref_name }}"

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Frontend tests
        run: pnpm test

      # --locked here is the reproducibility barrier for the whole release: the gate must be
      # green before any binary is built, so a Cargo.lock out of sync with Cargo.toml fails
      # here and blocks the build matrix (which builds from the same committed lock).
      - name: Clippy (strict)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  # ── Builds: only after a green gate. ────────────────────────────────────────────────────
  build:
    needs: gate
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            nasm

      - name: Install build tools (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install nasm

      - name: Install build tools (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install nasm -y

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The Rust build here goes through tauri-action → `tauri build`, which builds from the
      # committed Cargo.lock. It has no --locked flag, but the gate job already ran
      # `cargo {clippy,test} --locked` on the same commit, so a divergent lock never reaches
      # this matrix.
      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Plume v__VERSION__'
          releaseBody: |
            ## What's Changed
            - Automatic release for ${{ github.ref_name }}

            ## Download
            Choose the appropriate version for your operating system below.

            ## Installation
            - **Windows**: Download and run the `.msi` installer
            - **macOS**: Download and open the `.dmg` file
            - **Linux**: Download the `.deb` package or `.AppImage`
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'test') }}
          args: ${{ matrix.args }}

  # ── Homebrew: updates the tap cask with the SHA256s of the published DMGs. ──────────────
  # Requires the HOMEBREW_TAP_TOKEN secret (PAT with write on Axiome-Apps/homebrew-tap).
  # Skipped for pre-releases — users on the stable channel must not receive them.
  homebrew:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'test') }}
    steps:
      - name: Checkout Plume (scripts)
        uses: actions/checkout@v6

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: Axiome-Apps/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      # The DMGs are attached to the Release by the `build` job (macOS arm64 + x64). Since
      # `build` has finished, the assets exist. GITHUB_TOKEN is enough to read a release from
      # the same repo.
      - name: Download release DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --pattern "*.dmg" --dir dmg

      - name: Update cask
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          V="${VERSION#v}"
          ARM_SHA=$(sha256sum "dmg/Plume_${V}_aarch64.dmg" | cut -d' ' -f1)
          INTEL_SHA=$(sha256sum "dmg/Plume_${V}_x64.dmg" | cut -d' ' -f1)
          node scripts/update-cask.mjs "tap/Casks/plume.rb" "$V" "$ARM_SHA" "$INTEL_SHA"

      - name: Commit & push tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date, nothing to commit."
            exit 0
          fi
          git add Casks/plume.rb
          git commit -m "chore: update plume to ${{ github.ref_name }}"
          git push
